<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SilentVenge Quick Checklist — a private browser-local checklist for everyday tasks."><title>SilentVenge — Quick Checklist</title><style>:root{--bg:#05060b;--text:#f7f7fb;--muted:#9ca3b5;--line:#24283a;--c:#22d3ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 5%,#26134d,transparent 35%),var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}.wrap{width:min(850px,92%);margin:auto}nav{padding:18px 0;border-bottom:1px solid var(--line);background:#05060bdd;position:sticky;top:0;backdrop-filter:blur(12px)}nav .wrap{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:21px;background:linear-gradient(90deg,#fff,#a78bfa,#22d3ee);-webkit-background-clip:text;color:transparent}a{color:#c4c9d7;text-decoration:none}.back{border:1px solid var(--line);padding:8px 12px;border-radius:10px}main{padding:50px 0}.tag{font:12px monospace;color:var(--c);letter-spacing:2px}h1{font-size:clamp(40px,7vw,65px);line-height:1;margin:10px 0}p{color:var(--muted)}.card{background:linear-gradient(150deg,#101423,#080a11);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:24px}.row{display:flex;gap:9px}.row input{flex:1}input{width:100%;background:#05070c;color:#fff;border:1px solid #34394f;border-radius:10px;padding:12px;font:14px monospace}button{cursor:pointer;border:1px solid #3a4057;background:#111525;color:#fff;border-radius:10px;padding:10px 14px;font-weight:800}.primary{background:linear-gradient(100deg,#7c3aed,#06b6d4);border:0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.meta{font:12px monospace;color:#7f899e;align-self:center}#list{list-style:none;padding:0;margin:18px 0 0}.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #202437}.item label{flex:1;word-break:break-word}.done{text-decoration:line-through;color:#697185}@media(max-width:560px){.row{flex-direction:column}}</style></head><body><nav><div class="wrap"><a class="brand" href="index.html">SilentVenge // Quick Checklist</a><a class="back" href="index.html">← Home</a></div></nav><main class="wrap"><div class="tag">// LOCAL-FIRST • NO SERVER • NO UPLOADS</div><h1>Quick Checklist</h1><p>Add tasks, tick them off, delete them, and keep the list between browser sessions. Data stays in this browser's local storage.</p><section class="card"><div class="row"><input id="task" maxlength="200" placeholder="e.g. Buy charger, call home, finish report"><button id="add" class="primary">Add task</button></div><div class="actions"><button id="clearDone">Clear completed</button><button id="clearAll">Clear all</button><span class="meta" id="count"></span></div><ul id="list"></ul></section></main><script>const KEY='silentvenge.quickchecklist.v1',$=id=>document.getElementById(id);let items=[];try{items=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(items))items=[]}catch(e){items=[]}function save(){localStorage.setItem(KEY,JSON.stringify(items))}function render(){const list=$('list');list.textContent='';items.forEach((x,i)=>{const li=document.createElement('li');li.className='item';const cb=document.createElement('input');cb.type='checkbox';cb.checked=x.done;cb.addEventListener('change',()=>{items[i].done=cb.checked;save();render()});const label=document.createElement('label');label.textContent=x.text;if(x.done)label.className='done';const del=document.createElement('button');del.textContent='Delete';del.addEventListener('click',()=>{items.splice(i,1);save();render()});li.append(cb,label,del);list.appendChild(li)});const left=items.filter(x=>!x.done).length;$('count').textContent=items.length+' total • '+left+' remaining'}function add(){const text=$('task').value.trim();if(!text)return;items.push({text,done:false});$('task').value='';save();render();$('task').focus()}$('add').onclick=add;$('task').addEventListener('keydown',e=>{if(e.key==='Enter')add()});$('clearDone').onclick=()=>{items=items.filter(x=>!x.done);save();render()};$('clearAll').onclick=()=>{if(items.length&&confirm('Clear every task?')){items=[];save();render()}};render();</script></body></html>
