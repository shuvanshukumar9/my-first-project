<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SilentVenge — Password Toolkit</title><style>body{margin:0;background:#05060b;color:#f7f7fb;font:15px/1.6 system-ui,sans-serif}main{width:min(900px,92%);margin:auto;padding:50px 0}.card{background:#0b0e18;border:1px solid #24283a;border-radius:18px;padding:24px}input{width:100%;box-sizing:border-box;padding:13px;background:#05070c;color:#fff;border:1px solid #34394f;border-radius:10px;font:16px monospace}.meter{height:9px;background:#171a27;border-radius:99px;margin-top:14px;overflow:hidden}.meter i{display:block;width:0;height:100%;background:linear-gradient(90deg,#f472b6,#8b5cf6,#22d3ee)}.result{font-weight:800;margin-top:10px}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:16px}.check{padding:10px;border:1px solid #24283a;border-radius:9px;color:#9ca3b5}.ok{color:#67e8f9;border-color:#22d3ee55}@media(max-width:600px){.checks{grid-template-columns:1fr}}</style></head><body><main><p style="color:#22d3ee;font:12px monospace">// LOCAL-FIRST • PASSWORD HYGIENE</p><h1>SilentVenge Password Toolkit</h1><p>Check password characteristics locally in your browser. Nothing is sent to a server.</p><section class="card"><input id="pw" type="password" autocomplete="off" placeholder="Type a password to analyze"><div class="meter"><i id="bar"></i></div><div class="result" id="result">Start typing…</div><div class="checks"><div class="check" id="len">○ 12+ characters</div><div class="check" id="upper">○ Uppercase letter</div><div class="check" id="lower">○ Lowercase letter</div><div class="check" id="num">○ Number</div><div class="check" id="sym">○ Symbol</div><div class="check" id="repeat">○ No obvious repeated character run</div></div></section></main><script>const pw=document.getElementById('pw'),bar=document.getElementById('bar'),result=document.getElementById('result');function mark(id,ok,label){const e=document.getElementById(id);e.className='check '+(ok?'ok':'');e.textContent=(ok?'✓ ':'○ ')+label}function analyze(){const s=pw.value;let n=0;if(s.length>=12)n++;if(/[A-Z]/.test(s))n++;if(/[a-z]/.test(s))n++;if(/\d/.test(s))n++;if(/[^A-Za-z0-9]/.test(s))n++;const rep=/(.)\1\1/.test(s);bar.style.width=(n*20)+'%';result.textContent=s?['Very weak','Weak','Fair','Strong','Very strong'][Math.max(0,n-1)]:'Start typing…';mark('len',s.length>=12,'12+ characters');mark('upper',/[A-Z]/.test(s),'Uppercase letter');mark('lower',/[a-z]/.test(s),'Lowercase letter');mark('num',/\d/.test(s),'Number');mark('sym',/[^A-Za-z0-9]/.test(s),'Symbol');mark('repeat',!rep,'No obvious repeated character run')}pw.addEventListener('input',analyze)</script></body></html>
